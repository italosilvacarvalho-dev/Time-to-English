<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Time to English</title>
  <meta name="description" content="Inglês do dia a dia, offline: tradução, expressões e pronúncia.">
  <meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Aplica o tema antes de desenhar a página, para não piscar.
    (function () {
      var t = null;
      try { t = localStorage.getItem("tte.tema"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
      document.documentElement.dataset.tema = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <header class="topo">
      <div class="topo-linha">
        <h1 id="titulo">Traduzir</h1>
        <span id="selo-offline" class="selo selo-alerta" hidden></span>
        <button id="btn-tema" class="btn-icone" type="button" aria-label="Ativar modo escuro">
          <svg class="ico-lua" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="ico-sol" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main>
      <!-- TRADUZIR -->
      <section id="tela-traduzir" class="tela" aria-labelledby="titulo">
        <div class="direcao">
          <span id="lingua-origem" class="pilula pilula-destaque">Inglês</span>
          <button id="btn-inverter" class="btn-inverter" type="button" aria-label="Inverter: traduzir de português para inglês">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13"/><path d="m16 3 4 4-4 4"/><path d="M17 17H4"/><path d="m8 21-4-4 4-4"/></svg>
          </button>
          <span id="lingua-destino" class="pilula">Português</span>
        </div>

        <form id="form-traduzir" class="campo" autocomplete="off">
          <label id="rotulo-entrada" for="entrada" class="so-leitor">Palavra ou frase em inglês</label>
          <textarea id="entrada" rows="1" placeholder="Digite em inglês…" enterkeyhint="go" spellcheck="false" autocapitalize="off"></textarea>
          <button id="btn-voz" class="btn-voz" type="button" aria-label="Falar (gravar voz)" aria-pressed="false">
            <svg class="ico-mic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
            <svg class="ico-parar" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button id="btn-traduzir" class="btn-primario" type="submit">Traduzir</button>
        </form>
        <p id="status-voz" class="status-voz" role="status" hidden></p>

        <div class="bloco">
          <p class="rotulo">Exemplos do dia a dia</p>
          <div id="exemplos" class="chips"></div>
        </div>

        <div id="resultado" aria-live="polite"></div>

        <div id="cartao-modelo" class="cartao cartao-modelo" hidden>
          <div class="modelo-texto">
            <strong id="modelo-titulo">Tradutor offline</strong>
            <span id="modelo-desc">Baixe uma vez (cerca de 115 MB, de preferência no Wi-Fi) para traduzir qualquer frase sem internet. As expressões do dicionário já funcionam offline.</span>
          </div>
          <div id="modelo-progresso" class="progresso" hidden>
            <div class="progresso-barra"><div id="modelo-barra"></div></div>
            <span id="modelo-pct" class="progresso-txt">0%</span>
          </div>
          <button id="btn-baixar" class="btn-secundario" type="button">Baixar tradutor</button>
        </div>
      </section>

      <!-- SALVAS -->
      <section id="tela-salvas" class="tela" hidden>
        <p class="rotulo">Suas frases e expressões salvas</p>
        <div id="lista-salvas"></div>
      </section>

    </main>

    <nav class="abas" aria-label="Seções">
      <a href="#traduzir" data-aba="traduzir">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h8"/><path d="M8 3v2"/><path d="M5 9c1.5 3 4 5 7 6"/><path d="M11 5c-1 4-3.5 7-7 9"/><path d="m13 21 4-9 4 9"/><path d="M14.5 18h5"/></svg>
        Traduzir
      </a>
      <a href="#salvas" data-aba="salvas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        Salvas
      </a>
    </nav>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
