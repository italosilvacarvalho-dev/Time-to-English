name: Enviar banco de frases para o R2

# Rode manualmente em: Actions → "Enviar banco de frases para o R2" → Run workflow.
# Monta os pares português ⇄ inglês do Tatoeba e envia para o R2.
# Usa os mesmos segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
on:
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar o banco de frases
        run: python3 scripts/montar-frases.py --saida saida/frases-pt-en.tsv
      - name: Enviar para o R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put "time-to-english-modelos/dados/frases-pt-en.tsv" \
            --file saida/frases-pt-en.tsv --content-type "text/plain; charset=utf-8" --remote
